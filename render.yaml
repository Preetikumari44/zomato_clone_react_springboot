services:
  - type: web
    name: zomato-clone-backend
    runtime: docker
    plan: free
    dockerfilePath: ./zomato-clone-backend/Dockerfile
    dockerContext: ./zomato-clone-backend
    healthCheckPath: /api/restaurants
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: zomato-clone-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: zomato-clone-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: zomato-clone-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,https://*.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        value: local
      - key: CLOUDINARY_API_KEY
        value: local
      - key: CLOUDINARY_API_SECRET
        value: local

databases:
  - name: zomato-clone-db
    plan: free
    databaseName: zomato_clone
    user: zomato_clone_user
